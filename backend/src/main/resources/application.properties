# ============================================================================
# AgroWorld Backend Configuration
# ============================================================================
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agroworld_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Secrets
agroworld.jwt.secret=${JWT_SECRET:9a6747936da74da8a2d3e38719c8f0d8324e4c274888062955f1064e6ec3b934}
agroworld.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.agroworld.backend=DEBUG
